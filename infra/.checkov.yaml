# Checkov findings accepted on purpose, each with its reason. This is a small static site in
# one account, where a few dollars a month matters; revisit if that changes.
# CI runs checkov -d infra with this file as --config-file (the Terraform job in
# .github/workflows/compliance.yml).
compact: true
quiet: true
framework:
  - terraform
skip-check:
  # Cost and a second bucket per bucket. The state bucket is private, versioned (90 days of
  # old versions) and TLS-only; the site buckets hold only what the public site serves.
  - CKV_AWS_18 # S3 access logging
  - CKV_AWS_144 # S3 cross-region replication
  - CKV_AWS_145 # S3 encryption with KMS (SSE-S3 is used; a customer key is ~$1/month)
  - CKV2_AWS_62 # S3 event notifications
  # A customer KMS key costs ~$1/month, and CloudWatch and Budgets can't publish to a topic
  # encrypted with the AWS-managed SNS key. The alerts carry no secrets.
  - CKV_AWS_26 # SNS topic encryption
  # The qa zone: DNSSEC would need a KMS key and a DS record at Cloudflare that follows its
  # rotation (decided in M0: no DS for qa), and query logs would cost money for a zone that
  # only ever answers for a password-protected test site.
  - CKV2_AWS_38 # Route 53 DNSSEC
  - CKV2_AWS_39 # Route 53 query logging
  # The site buckets. Production's role may not set a lifecycle rule at all, because one could
  # expire every old version of the site (the NoProductionDeletes guardrail); QA's bucket is
  # destroyed every night. The state bucket has its rule. So production keeps an old version of
  # the site's files (about 3 MB) for every deploy, for good: cents a year, and every one is a
  # rollback.
  - CKV2_AWS_61 # S3 lifecycle configuration
  # The distributions. WAF costs at least $5 a month per site, and a static site has no forms,
  # logins or server code for it to protect; CloudFront's free Shield Standard still applies,
  # and the traffic alarms catch a flood. The Log4j rule needs WAF, and nothing here runs Java.
  - CKV_AWS_68 # CloudFront WAF
  - CKV2_AWS_47 # CloudFront WAF with the Log4j rule
  # Access logs would record every visitor's IP address, which this site has no use for, and
  # need a bucket and a retention rule of their own. The traffic alarms watch the volume.
  - CKV_AWS_86 # CloudFront access logging
  # One bucket in one region is enough for a portfolio: S3's own availability, and a second
  # bucket would double what every publish has to keep in step.
  - CKV_AWS_310 # CloudFront origin failover
  # A public portfolio is for anyone, anywhere.
  - CKV_AWS_374 # CloudFront geo restriction
# Two more are skipped where they apply, not here, so everything else is still checked:
# CKV_AWS_356 on the CI roles' access policy (infra/bootstrap/ci_roles.tf says why), and
# CKV2_AWS_32 on the site distribution (infra/modules/site/cloudfront.tf).
