# Build, test and change-management controls for this repository.
# Each job records its checks as JSON evidence. The Evidence job bundles them with
# SHA-256 hashes; on main, the Sign evidence job signs the bundle with a GitHub artifact
# attestation.
# Build uploads the site once (site-dist); every later job uses that exact artifact.
name: Compliance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # weekly, so new CVEs and rule changes are caught without a commit
  workflow_dispatch:

permissions: {} # every job asks for exactly what it needs

concurrency:
  # Pull requests share a group per branch, so a new push cancels the superseded run.
  # Every other run gets a group to itself, so a deploy waiting for approval (where the plan
  # offers a reviewer) never blocks (or cancels) the runs behind it. The deploy job has its
  # own group.
  group: compliance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  UV_VERSION: '0.12.15'
  ZIZMOR_VERSION: '1.30.1'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' # linux_x64 tarball
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' # linux_amd64 tarball
  # Terraform's checksums come from HashiCorp's signed SHA256SUMS (signature checked when pinned).
  TERRAFORM_VERSION: '1.16.3'
  TERRAFORM_SHA256: '093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8' # linux_amd64 zip
  TFLINT_VERSION: '0.64.0'
  TFLINT_SHA256: 'cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537' # linux_amd64 zip
  CHECKOV_VERSION: '3.3.19'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no caches: every run installs from the lockfile
      - name: Install and audit dependencies
        run: |
          mkdir -p results
          set +e
          # The lockfile is checked before npm ci, so a bad one never downloads anything.
          python3 scripts/ci/check_lockfile.py | tee results/lockfile.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            # .npmrc applies here too: no install scripts, no git dependencies.
            npm ci --no-audit --no-fund
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            npm audit --audit-level=high --json > results/npm-audit.json
            audit=$?
            npm audit signatures | tee results/npm-audit-signatures.txt
            sigs=${PIPESTATUS[0]}
            for c in "$audit" "$sigs"; do [ "$c" -ne 0 ] && code=$c; done
          fi
          summary=$(python3 -c "
          import json
          v = json.load(open('results/npm-audit.json'))['metadata']['vulnerabilities']
          print(f\"{v['high'] + v['critical']} high or critical vulnerabilities ({v['total']} of any severity)\")
          " 2>/dev/null)
          python3 scripts/ci/record.py dependencies "$code" --title "Dependencies" \
            --control "SOC 2 CC7.1" --control "ISO 27001 A.8.8" \
            --tool "npm $(npm --version) (ci, audit, audit signatures)" \
            --detail "lockfile of registry tarballs, each under its own name, with sha512 hashes; registry signatures verified; ${summary:-audit did not complete}"
          exit "$code"
      - name: Lint, type-check, test and build
        run: |
          set +e
          code=0
          npm run lint || code=1
          npm run check || code=1
          npm test -- --reporter=default --reporter=junit --outputFile.junit=results/unit-junit.xml || code=1
          # The scripts that decide what the evidence says (lockfile, branch rules, bundle).
          python3 -I -m unittest discover -s tests/ci 2>&1 | tee results/ci-script-tests.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || code=1
          npm run build || code=1
          # Now that dist/ exists: every file in it has a Content-Type, so Deploy production can publish it.
          python3 -I -m unittest discover -s tests/ci -p test_publish_site.py -k real_build || code=1
          npm run test:dist -- --reporter=default --reporter=junit --outputFile.junit=results/dist-junit.xml || code=1
          tests=$(python3 -c "
          import glob, xml.etree.ElementTree as ET
          print(sum(int(ET.parse(f).getroot().get('tests', 0)) for f in glob.glob('results/*-junit.xml')))
          " 2>/dev/null)
          ci=$(grep -o '^Ran [0-9]*' results/ci-script-tests.txt | tr -dc '0-9')
          pages=$(find dist -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          python3 scripts/ci/record.py build "$code" --title "Build" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.29" \
            --tool "node $(node --version), python $(python3 --version | tr -dc '0-9.'), ESLint, astro check, Vitest, unittest, Astro" \
            --detail "lint, type check, ${tests:-0} unit and dist tests, ${ci:-0} CI script tests, ${pages} pages built"
          exit "$code"
      - name: Hash the built site
        run: |
          python3 scripts/ci/dist_manifest.py dist dist-manifest.json
          cp dist-manifest.json results/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: |
            dist/
            dist-manifest.json
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-build
          path: results/
          retention-days: 7

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: .
      - name: Test the built site in Chrome, iPhone (WebKit) and Pixel
        run: |
          mkdir -p results
          set +e
          # Prove these are the bytes the Build job hashed, then test them.
          python3 scripts/ci/dist_manifest.py --check dist dist-manifest.json
          code=$?
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=results/e2e-junit.xml npx playwright test --reporter=list,junit,html
          e2e=$?
          [ "$code" -eq 0 ] && code=$e2e
          tests=$(grep -o '<testsuites [^>]*tests="[0-9]*"' results/e2e-junit.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | tr -dc '0-9')
          python3 scripts/ci/record.py e2e "$code" --title "E2E" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.29" \
            --tool "Playwright $(npx playwright --version | tr -dc '0-9.'), axe-core" \
            --detail "${tests:-0} tests on the Build artifact: console and CSP errors, WCAG 2.2 AA"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-e2e
          path: results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to read the production environment's settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just this commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install gitleaks and actionlint (checksums verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" -C bin gitleaks
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" -C bin actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan git history for secrets
        run: |
          mkdir -p results
          set +e
          gitleaks git --redact --no-banner --report-format json \
            --report-path results/secret-scan.json .
          code=$?
          leaks=$(python3 -c "import json; print(len(json.load(open('results/secret-scan.json'))))" 2>/dev/null)
          commits=$(git rev-list --count HEAD)
          python3 scripts/ci/record.py secret-scan "$code" --title "Secret scan" \
            --control "SOC 2 CC6.1" --control "ISO 27001 A.8.12" \
            --tool "gitleaks ${GITLEAKS_VERSION}" \
            --detail "${leaks:-unknown} leaks in ${commits} commits (values redacted)"
          exit "$code"
      - name: Refuse PDFs
        if: success() || failure()
        run: |
          mkdir -p results
          set +e
          # gitleaks can't read a PDF's compressed text, and no PDF belongs here, so any PDF on
          # any branch or tag fails, found by name or by content.
          python3 -I scripts/ci/check_pdfs.py --history | tee results/pdf-check.txt
          code=${PIPESTATUS[0]}
          summary=$(grep -E '^[0-9]+ files checked' results/pdf-check.txt)
          python3 scripts/ci/record.py pdf-check "$code" --title "No PDFs" \
            --control "SOC 2 C1.1" --control "ISO 27001 A.5.34" \
            --tool "scripts/ci/check_pdfs.py (standard library)" \
            --detail "${summary:-the check did not complete} across every branch and tag"
          exit "$code"
      - name: Lint the workflows
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits read the actions' repositories
        run: |
          mkdir -p results
          set +e
          # Online, so zizmor can also check each pinned SHA really is in the action's own
          # repository (not a fork's commit) and has no known advisory.
          uvx "zizmor@${ZIZMOR_VERSION}" --format json .github/workflows > results/zizmor.json
          code=$?
          # actionlint also runs shellcheck (preinstalled on the runner) over every run: block.
          actionlint -format '{{json .}}' > results/actionlint.json
          lint=$?
          [ "$code" -eq 0 ] && code=$lint
          [ "$lint" -ne 0 ] && actionlint
          summary=$(python3 -c "
          import json
          z = len(json.load(open('results/zizmor.json')))
          a = len(json.load(open('results/actionlint.json')) or [])
          print(f'{z} zizmor findings, {a} actionlint findings')
          " 2>/dev/null)
          python3 scripts/ci/record.py workflow-lint "$code" --title "Workflow lint" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.9" \
            --tool "zizmor ${ZIZMOR_VERSION}, actionlint ${ACTIONLINT_VERSION}" \
            --detail "${summary:-lint did not complete} (pinned actions, token permissions, injection, shell)"
          exit "$code"
      - name: Check branch and environment protection
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A scheduled run's event has no repository object; it always runs on the default branch.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          # The reviewer requirement is waived on a private repository only while this is unset.
          # A repository variable, like the deploy job's: this job has no environment to read one from.
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set +e
          python3 scripts/ci/check_branch_rules.py --branch "$DEFAULT_BRANCH" --out results/branch-rules.json
          code=$?
          python3 scripts/ci/record.py branch-rules "$code" --title "Branch rules" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.32" \
            --tool "GitHub rulesets and environments API" \
            --detail "${DEFAULT_BRANCH}: pull requests, required checks, linear history, no force pushes or deletion; production deploys from ${DEFAULT_BRANCH} only, with approval where the plan offers it (results/branch-rules.json says if it was waived)"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-security
          path: results/
          retention-days: 7

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install Terraform and TFLint (checksums verified)
        run: scripts/ci/install_terraform.sh
      - name: Format, validate, lint and scan the infrastructure
        env:
          # The roots share one provider download. The cache lives only for this job.
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
        run: |
          mkdir -p results "$TF_PLUGIN_CACHE_DIR"
          set +e
          code=0
          terraform fmt -check -recursive -diff infra || code=1
          # A root is a directory of .tf files outside infra/modules, and each one must commit
          # its provider lock file, so CI installs exactly the providers that were reviewed.
          roots=$(find infra -name '*.tf' -not -path '*/.terraform/*' -not -path 'infra/modules/*' \
            -exec dirname {} \; | sort -u)
          [ -n "$roots" ] || { echo "::error::no Terraform roots found under infra/"; code=1; }
          for dir in $roots; do
            echo "::group::$dir"
            if [ -f "$dir/.terraform.lock.hcl" ]; then
              # No backend and no credentials: this checks the code, not what's deployed.
              (cd "$dir" && terraform init -backend=false -input=false -lockfile=readonly > /dev/null \
                && terraform validate -no-color) || code=1
              tflint --chdir "$dir" --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact || code=1
            else
              echo "::error::$dir has no .terraform.lock.hcl (run terraform init there and commit it)"
              code=1
            fi
            echo "::endgroup::"
          done
          # A module has no lock file or backend of its own: validate reaches it through each root
          # that calls it, and TFLint checks it here.
          modules=$(find infra/modules -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort)
          for dir in $modules; do
            tflint --chdir "$dir" --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact || code=1
          done
          # The CloudFront function runs on every visit. Its tests need only the runner's own Node,
          # and run here because the dev container can't see infra/.
          node --test infra/modules/site/viewer-request.test.mjs || code=1
          # Checkov's version is pinned; its dependencies resolve only to releases at least 7
          # days old, the same rule as npm's min-release-age.
          uvx --exclude-newer "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" "checkov@${CHECKOV_VERSION}" \
            -d infra --config-file infra/.checkov.yaml -o json > results/terraform-checkov.json || code=1
          failed=$(python3 -c "
          import json
          r = json.load(open('results/terraform-checkov.json'))
          r = r if isinstance(r, list) else [r]
          print(sum(x['summary']['failed'] for x in r))
          " 2>/dev/null)
          python3 scripts/ci/record.py terraform "$code" --title "Terraform" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.9" \
            --tool "terraform ${TERRAFORM_VERSION}, tflint ${TFLINT_VERSION}, checkov ${CHECKOV_VERSION}" \
            --detail "fmt, validate and lint for $(echo "$roots" | paste -sd, -), lint for $(echo "${modules:-no modules}" | paste -sd, -), the CloudFront function's tests; ${failed:-unknown} checkov findings not accepted in infra/.checkov.yaml"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: result-terraform
          path: results/
          retention-days: 7

  evidence:
    name: Evidence
    needs: [build, e2e, security, terraform]
    if: ${{ !cancelled() }} # also when a check failed, so the bundle records the failure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: results
      - name: Build the evidence bundle
        id: bundle
        run: |
          set +e
          python3 scripts/ci/build_evidence.py results evidence \
            --expect dependencies --expect build --expect e2e \
            --expect secret-scan --expect pdf-check --expect workflow-lint --expect branch-rules \
            --expect terraform
          echo "code=$?" >> "$GITHUB_ENV"
          tar -czf "evidence-${GITHUB_SHA}.tar.gz" evidence
          # Sign evidence signs this digest, not whatever artifact carries the bundle's name.
          echo "digest=sha256:$(sha256sum "evidence-${GITHUB_SHA}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-evidence-${{ github.sha }}
          path: evidence-${{ github.sha }}.tar.gz
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
      - name: Fail if any check failed
        run: exit "${code:-1}"

  # A job of its own, so only runs on main can mint the OIDC token that signs. It signs the
  # exact bundle the Evidence job hashed, including one that records a failed check: that's
  # evidence as well. Verify with `gh attestation verify evidence-<sha>.tar.gz --repo ...`.
  sign:
    name: Sign evidence
    needs: evidence
    if: ${{ !cancelled() && needs.evidence.outputs.digest != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # to sign the attestation (Sigstore)
      attestations: write # to store it on GitHub
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: evidence-${{ github.sha }}.tar.gz
          subject-digest: ${{ needs.evidence.outputs.digest }}

  deploy-production:
    name: Deploy production
    needs: [build, e2e, security, terraform, evidence, sign]
    # Main only, once AWS is set up, behind the DEPLOY_ENABLED variable. The protected
    # "production" environment's reviewer approves the run where the plan offers one (not on
    # a private repository below Enterprise: check_branch_rules.py records the waiver).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # a new distribution can take 15 minutes to deploy
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never stop a deploy halfway
    permissions:
      contents: read
      id-token: write # to assume portfolio-prod through GitHub's OIDC provider
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - name: Mask the account ID
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Bucket names, ARNs and AWS errors contain it, and a masked role ARN doesn't hide it.
          echo "::add-mask::${AWS_ACCOUNT_ID}"
      - name: Stop if main has moved on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A run that waited for approval must never publish an older commit over a newer one.
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main is at ${tip} now, not ${GITHUB_SHA}. Only the run for ${tip} may deploy; if it didn't, rerun its failed jobs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site
      - name: Check the site is the tested build
        run: python3 scripts/ci/dist_manifest.py --check site/dist site/dist-manifest.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: deploy-production-${{ github.run_id }}
          role-skip-session-tagging: true # the trust policy allows no sts:TagSession
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Install Terraform (checksum verified)
        run: scripts/ci/install_terraform.sh
      - name: Plan
        id: plan
        working-directory: infra/envs/prod
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_origin_access_control_id: ${{ vars.ORIGIN_ACCESS_CONTROL_ID }}
        run: |
          # CI logs are public, so Terraform's own output goes to files. Only its summary line,
          # the list of changes (addresses, no values) and any error reach the log.
          mkdir -p "$GITHUB_WORKSPACE/results"
          terraform init -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}" -no-color \
            > "$RUNNER_TEMP/init.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/init.log"; exit 1; }
          terraform plan -out=tfplan -no-color \
            > "$RUNNER_TEMP/plan.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/plan.log"; exit 1; }
          grep -E '^(Plan:|No changes|Changes to Outputs)' "$RUNNER_TEMP/plan.log" | tee "$GITHUB_WORKSPACE/results/plan.txt"
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          # Fails if the plan would remove the bucket or the distribution, or the bucket's protections.
          python3 "$GITHUB_WORKSPACE/scripts/ci/plan_guard.py" "$RUNNER_TEMP/plan.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Apply
        id: apply
        working-directory: infra/envs/prod
        run: |
          terraform apply -no-color tfplan \
            > "$RUNNER_TEMP/apply.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/apply.log"; exit 1; }
          grep '^Apply complete' "$RUNNER_TEMP/apply.log"
      - name: Publish the tested build
        id: publish
        run: |
          # Steps run as bash -e without pipefail, so without this a failed publish passes as tee.
          set -o pipefail
          bucket=$(terraform -chdir=infra/envs/prod output -raw bucket)
          distribution=$(terraform -chdir=infra/envs/prod output -raw distribution_id)
          python3 scripts/ci/publish_site.py --dist site/dist --bucket "$bucket" --distribution-id "$distribution" \
            | tee results/publish.txt
      - name: Smoke test
        id: smoke
        run: |
          host=$(terraform -chdir=infra/envs/prod output -raw domain)
          edge=$(terraform -chdir=infra/envs/prod output -raw distribution_domain_name)
          distribution=$(terraform -chdir=infra/envs/prod output -raw distribution_id)
          python3 scripts/ci/smoke.py --host "$host" --redirect-host "www.${host}" --edge "$edge" \
            --dist site/dist --manifest site/dist-manifest.json --distribution-id "$distribution" \
            --out results/smoke.json
      - name: Record the deploy
        if: always()
        env:
          OUTCOMES: >-
            plan ${{ steps.plan.outcome }}, apply ${{ steps.apply.outcome }},
            publish ${{ steps.publish.outcome }}, smoke test ${{ steps.smoke.outcome }}
          SMOKE_PASSED: ${{ steps.smoke.outcome == 'success' }}
        run: |
          mkdir -p results
          code=1
          [ "$SMOKE_PASSED" = true ] && code=0
          # || true: under bash -e a missing file (a failed plan or apply) would end the step here.
          plan=$(cat results/plan.txt 2>/dev/null || true)
          published=$(cat results/publish.txt 2>/dev/null || true)
          python3 scripts/ci/record.py deploy "$code" --title "Deploy production" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.32" \
            --tool "terraform ${TERRAFORM_VERSION}, AWS CLI, scripts/ci/publish_site.py and smoke.py" \
            --detail "${OUTCOMES}. ${plan:-no plan}. ${published:-nothing published}. The smoke test compares the live home page with dist-manifest.json (results/smoke.json)."
      - name: Keep the account ID out of the evidence
        if: always()
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # The log is masked, but an uploaded artifact isn't, and smoke.json quotes error text.
          if [ -n "$AWS_ACCOUNT_ID" ] && [ -d results ] && grep -rlF "$AWS_ACCOUNT_ID" results/ > "$RUNNER_TEMP/leaks"; then
            xargs sed -i "s/${AWS_ACCOUNT_ID}/<account>/g" < "$RUNNER_TEMP/leaks"
            echo "::warning::Removed the account ID from $(wc -l < "$RUNNER_TEMP/leaks") evidence files."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deploy-evidence-${{ github.sha }}
          path: results/
          retention-days: 90
