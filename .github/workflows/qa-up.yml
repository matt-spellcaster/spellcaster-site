# Puts a branch on https://qa.spellcaster.foo/, behind a password, to try on real phones.
# Run it from the Actions tab: QA up → Run workflow → pick the branch. It publishes the site
# the Compliance workflow already built and tested for that commit, so nothing is built
# twice. QA down (and every night at 07:17 UTC) takes QA away again. docs/qa.md has the rest.
name: QA up

on:
  workflow_dispatch:

permissions: {} # every job asks for exactly what it needs

concurrency:
  group: qa-infra # shared with QA down, so the two never run at once
  cancel-in-progress: false # never stop Terraform halfway

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # The same pins as compliance.yml (a unit test checks they agree).
  TERRAFORM_VERSION: '1.16.3'
  TERRAFORM_SHA256: '093b6ae9a2228af5029c41606bc96eb583553528aad1bfe7e0b4d62fc91e25d8' # linux_amd64 zip
  TFLINT_VERSION: '0.64.0'
  TFLINT_SHA256: 'cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537' # linux_amd64 zip

jobs:
  find:
    name: Find the tested build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to read the Compliance runs for this commit
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the Compliance run that built and tested this commit
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          run_id=$(python3 scripts/ci/find_tested_build.py)
          echo "Publishing the build from https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy QA
    needs: find
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # a new distribution can take 15 minutes to deploy
    environment:
      name: qa
      url: https://qa.spellcaster.foo/
    permissions:
      contents: read
      actions: read # to download the tested build from its Compliance run
      id-token: write # to assume portfolio-qa through GitHub's OIDC provider
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - name: Mask the account ID
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # Bucket names, ARNs and AWS errors contain it, and a masked role ARN doesn't hide it.
          echo "::add-mask::${AWS_ACCOUNT_ID}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: site
          run-id: ${{ needs.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check the site is the tested build
        run: python3 scripts/ci/dist_manifest.py --check site/dist site/dist-manifest.json
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: qa-up-${{ github.run_id }}
          role-skip-session-tagging: true # the trust policy allows no sts:TagSession
          aws-region: us-east-1
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Install Terraform (checksum verified)
        run: scripts/ci/install_terraform.sh
      - name: Plan
        id: plan
        working-directory: infra/envs/qa
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_origin_access_control_id: ${{ vars.ORIGIN_ACCESS_CONTROL_ID }}
        run: |
          # The password's digest, for this step only (masked; never in GITHUB_ENV).
          . "$GITHUB_WORKSPACE/scripts/ci/qa_auth.sh"
          # CI logs are public, so Terraform's own output goes to files. Only its summary line,
          # the list of changes (addresses, no values) and any error reach the log.
          mkdir -p "$GITHUB_WORKSPACE/results"
          terraform init -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}" -no-color \
            > "$RUNNER_TEMP/init.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/init.log"; exit 1; }
          # No other distribution may hold qa.spellcaster.foo (a stack whose state was lost).
          known=$(terraform output -raw distribution_id 2> /dev/null || true)
          python3 "$GITHUB_WORKSPACE/scripts/ci/leftovers.py" --preflight --known "$known"
          terraform plan -out=tfplan -no-color \
            > "$RUNNER_TEMP/plan.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/plan.log"; exit 1; }
          grep -E '^(Plan:|No changes|Changes to Outputs)' "$RUNNER_TEMP/plan.log" | tee "$GITHUB_WORKSPACE/results/plan.txt"
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          # QA is rebuilt at will, so removing is fine, but weakening the bucket's protections isn't.
          python3 "$GITHUB_WORKSPACE/scripts/ci/plan_guard.py" "$RUNNER_TEMP/plan.json" --allow-removal \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Apply
        id: apply
        working-directory: infra/envs/qa
        run: |
          terraform apply -no-color tfplan \
            > "$RUNNER_TEMP/apply.log" 2>&1 || { sed -n '/Error/,$p' "$RUNNER_TEMP/apply.log"; exit 1; }
          grep '^Apply complete' "$RUNNER_TEMP/apply.log"
      - name: Publish the tested build
        id: publish
        run: |
          # Steps run as bash -e without pipefail, so without this a failed publish passes as tee.
          set -o pipefail
          bucket=$(terraform -chdir=infra/envs/qa output -raw bucket)
          distribution=$(terraform -chdir=infra/envs/qa output -raw distribution_id)
          python3 scripts/ci/publish_site.py --dist site/dist --bucket "$bucket" --distribution-id "$distribution" \
            | tee results/publish.txt
      - name: Smoke test
        id: smoke
        run: |
          # The Authorization header, for this step only (masked; never in GITHUB_ENV).
          . scripts/ci/qa_auth.sh
          host=$(terraform -chdir=infra/envs/qa output -raw domain)
          edge=$(terraform -chdir=infra/envs/qa output -raw distribution_domain_name)
          distribution=$(terraform -chdir=infra/envs/qa output -raw distribution_id)
          python3 scripts/ci/smoke.py --host "$host" --edge "$edge" --noindex --auth-header-env QA_AUTH_HEADER \
            --dist site/dist --manifest site/dist-manifest.json --distribution-id "$distribution" \
            --out results/smoke.json
      - name: Record the deploy
        if: always()
        env:
          OUTCOMES: >-
            plan ${{ steps.plan.outcome }}, apply ${{ steps.apply.outcome }},
            publish ${{ steps.publish.outcome }}, smoke test ${{ steps.smoke.outcome }}
          SMOKE_PASSED: ${{ steps.smoke.outcome == 'success' }}
          BUILD_RUN: ${{ needs.find.outputs.run-id }}
        run: |
          mkdir -p results
          code=1
          [ "$SMOKE_PASSED" = true ] && code=0
          # || true: under bash -e a missing file (a failed plan or apply) would end the step here.
          plan=$(cat results/plan.txt 2>/dev/null || true)
          published=$(cat results/publish.txt 2>/dev/null || true)
          python3 scripts/ci/record.py qa-deploy "$code" --title "Deploy QA" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.31" \
            --tool "terraform ${TERRAFORM_VERSION}, AWS CLI, scripts/ci/publish_site.py and smoke.py" \
            --detail "${OUTCOMES}. The build of Compliance run ${BUILD_RUN}. ${plan:-no plan}. ${published:-nothing published}. The smoke test checks the password and compares the live home page with dist-manifest.json (results/smoke.json)."
      - name: Keep the account ID out of the evidence
        if: always()
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          # The log is masked, but an uploaded artifact isn't, and smoke.json quotes error text.
          if [ -n "$AWS_ACCOUNT_ID" ] && [ -d results ] && grep -rlF "$AWS_ACCOUNT_ID" results/ > "$RUNNER_TEMP/leaks"; then
            xargs sed -i "s/${AWS_ACCOUNT_ID}/<account>/g" < "$RUNNER_TEMP/leaks"
            echo "::warning::Removed the account ID from $(wc -l < "$RUNNER_TEMP/leaks") evidence files."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qa-evidence-${{ github.sha }}
          path: results/
          retention-days: 30

  # No AWS access and no QA password: Lighthouse is a large dependency tree, so it runs where it
  # can reach nothing. It checks the same tested build, served inside this job, as a phone
  # would see it. Performance only warns here, since it has none of CloudFront's compression.
  lighthouse:
    name: Lighthouse
    needs: find
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # to download the tested build from its Compliance run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no caches: every run installs from the lockfile
      - name: Install dependencies and Chromium
        run: |
          # The lockfile is checked before npm ci, so a bad one never downloads anything.
          python3 scripts/ci/check_lockfile.py
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: .
          run-id: ${{ needs.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Run Lighthouse on every page
        run: |
          mkdir -p results
          set +e
          python3 scripts/ci/dist_manifest.py --check dist dist-manifest.json
          code=$?
          if [ "$code" -eq 0 ]; then
            npm run lighthouse
            code=$?
          fi
          summary=$(python3 -c "
          import json
          rows = json.load(open('test-results/lighthouse/summary.json'))
          print('; '.join(r['page'] + ': ' + ', '.join(f'{k} {v}' for k, v in r['scores'].items()) for r in rows))
          " 2>/dev/null)
          python3 scripts/ci/record.py lighthouse "$code" --title "Lighthouse" \
            --control "SOC 2 CC8.1" --control "ISO 27001 A.8.29" \
            --tool "Lighthouse $(node -p "require('./node_modules/lighthouse/package.json').version"), mobile" \
            --detail "accessibility and best practices at least 0.95 on every page, performance warns under 0.9. ${summary:-no scores}"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-${{ github.sha }}
          path: |
            results/
            test-results/lighthouse/
          retention-days: 30
